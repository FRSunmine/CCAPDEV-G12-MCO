<!DOCTYPE html>
<html></html>
<head>
    <meta charset="UTF-8"/>
    <title>Animo Eats</title>
    <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
    <link rel="stylesheet" href="../assets/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script src="../processes/filterRestaurants.js"></script>
</head>
<body> 
    <header class="header">
        <div class="header-container">
            <div class="logo-container">
            <a href="welcome.html"><img src="../img/AnimoEats-Logo2.png" class="site-logo"></a>
            </div>
            <nav class="nav-links">
                <a href="main.html">Search</a>
                <a href="login.html">Login</a>
                <!-- Add more navigation links here if needed -->
            </nav>
        </div>
    </header>

    <!-- DEV: profile redirect button !!! -->
    <div style="padding:12px 24px;">
        <button id="dev-profile-btn" class="register-button small-button" style="width:220px; padding:8px 14px; font-size:15px;">
        Open Profile
        </button>
    </div>

    <script>
        document.getElementById('dev-profile-btn').onclick = function () {
        location.href = 'profile.html';
        };
    </script>
    <!-- DEV: profile redirect button !!! --> 

    <main>
        <section class="top-hero">
            <div class="page-container hero-row">
                <div class="hero-text">
                    <h1>Discover restaurants near DLSU!</h1>
                    <p class="sub">Reviews and simple guides to local dining spots.</p>

                    <form class="search-form" role="search" id="search-form">
                        <input type="search" id="search-input" name="q" placeholder="Search by name or location" />
                        <button type="submit">Search</button>
                    </form>
                </div>

                <div class="hero-image">
                    <div class="image-placeholder">mock ad here :)</div>
                </div>
            </div>
        </section>

        <section class="layout container">
            <aside class="filters">
                <h3>Filters</h3>
                <form>
                        <legend>Category</legend>
                        <select name="filter" id="cuisine-filter">
                        </select><br>
                    <!-- <label>
                        Distance
                        <select>
                            <option>Any</option>
                            <option>Within 1 km</option>
                            <option>Within 3 km</option>
                        </select>
                    </label> -->

                    <fieldset class="price-filter">
                        <legend>Price</legend>
                        <label><input type="checkbox" value="₱"> ₱</label>
                        <label><input type="checkbox" value="₱₱"> ₱₱</label>
                        <label><input type="checkbox" value="₱₱₱"> ₱₱₱</label>
                    </fieldset>

                    <button type="button" id="clear-filters">Reset</button>
                </form>
            </aside>

            <section class="results">
                <h2 class="sr-only">Restaurant results</h2>

                <div class="cards-grid" id="cards-grid">
                    <!-- JS will populate restaurant cards here -->
                </div>
            </section>
        </section>
    </main>
    <div id="inset-backdrop" class="inset-backdrop"></div>
    <div id="restaurant-inset" class="inset">
    <button id="inset-close" class="inset-close">&times;</button>
    <div class="inset-content">
        <div id="inset-map" class="inset-map"></div>
        <div class="inset-info"></div>
    </div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; Animo Eats — For the Lasallian community</p>
        </div>
    </footer>
</body>
</html>
