<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Animo Eats</title>
    <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
    <link rel="stylesheet" href="../assests/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo-container">
            <a href="welcome.html"><img src="../img/AnimoEats-Logo2.png" class="site-logo"></a>
            </div>
        </div>
    </header>

    <main>
        <div class="login-container">
            <h1>Login</h1>
            <form data-form="login">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" name="email" required />
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" required />
                </div>


                <div id="loginError" class="error-message"></div>
                <button type="submit" class="login-button">Login</button>
            </form>
            <div class="signup-link">
                Don't have an account? <a href="register.html">Sign up here</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; Animo Eats — For the Lasallian community</p>
        </div>
    </footer>

    <script src="../processes/script.js" defer></script>
</body>
</html>
